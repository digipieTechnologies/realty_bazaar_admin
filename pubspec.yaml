name: brokerflow_admin
description: "BrokerFlow Super Admin Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.9
  go_router: ^17.3.0
  dio: ^5.10.0
  shimmer: ^3.0.0
  supabase_flutter: ^2.16.0
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  equatable: ^2.1.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.1
  permission_handler: ^11.4.0
  device_info_plus: ^11.1.0
  package_info_plus: ^8.2.0
  collection: ^1.19.1
  intl: ^0.20.2
  path: ^1.9.1
  responsive_builder: ^0.7.1
  universal_platform: ^1.1.0
  file_picker: ^11.0.2
  easy_localization: ^3.0.7
  video_player: ^2.11.1
  flutter_typeahead: ^6.0.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/app_logo.png"
  windows:
    generate: true
    image_path: "assets/logo/app_logo.png"
  macos:
    generate: true
    image_path: "assets/logo/app_logo.png"
  linux:
    generate: true
    image_path: "assets/logo/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/translations/
    - assets/images/property/
